<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courdeck｜今季アニメ・週間放送表・国内の配信状況</title>
<meta name="description" content="今季・過去のアニメを自動で集め、一覧・集計・週間放送スケジュール・国内の配信状況として表示する無料のWebアプリです。登録不要。">
<link rel="canonical" href="https://naatlant.github.io/courdeck/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Courdeck">
<meta property="og:title" content="Courdeck｜今季アニメ・週間放送表・国内の配信状況">
<meta property="og:description" content="今季・過去のアニメを自動で集め、一覧・集計・週間放送スケジュール・国内の配信状況として表示する無料のWebアプリです。登録不要。">
<meta property="og:url" content="https://naatlant.github.io/courdeck/">
<meta property="og:image" content="https://naatlant.github.io/courdeck/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#15181c">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --border:#dfe3e8; --text:#1c2024;
    --muted:#6b7280; --accent:#2563eb; --accent-weak:#eaf0fe;
    --danger:#c0392b; --ok:#127c4a; --warn:#a86612; --row:#fafbfc;
    --shadow:0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15181c; --panel:#1d2126; --border:#333a42; --text:#e6e8ea;
      --muted:#9aa3ad; --accent:#5b8dee; --accent-weak:#22304a;
      --danger:#e06c5c; --ok:#4cc38a; --warn:#e0a95c; --row:#21262c; --shadow:none;
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;padding:20px 20px 80px;background:var(--bg);color:var(--text);
    font-family:"Segoe UI","Yu Gothic UI","Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif;
    font-size:14px;line-height:1.6;}
  .wrap{max-width:1180px;margin:0 auto}
  h1{font-size:20px;margin:0;font-weight:600;letter-spacing:.02em}
  .brand{margin:0;font-size:24px;letter-spacing:-.015em;line-height:1}
  .brand a{display:flex;align-items:center;gap:9px;color:inherit;text-decoration:none;
    border-radius:8px;transition:opacity .15s ease}
  .brand a:hover{opacity:.8}
  .brand a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
  .brand .mark{width:30px;height:26px;flex:none}
  /* 束ねたカード。手前の1枚が今見ているクール。
     背景色で縁取りして、重なっても輪郭が分かるようにする */
  .brand .mark rect{fill:currentColor;opacity:.22;stroke:var(--bg);stroke-width:1.6}
  .brand .mark rect:nth-child(2){opacity:.36}
  .brand .mark rect.lit{fill:var(--accent);opacity:1}
  .brand .wm{font-weight:700}
  .brand .wm span{color:var(--accent);font-weight:600}
  .head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .langsw{margin-left:auto;display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .langsw button{border:none;border-radius:0;padding:7px 16px;font-size:12.5px;font-weight:600;
    background:var(--panel);color:var(--muted)}
  .langsw button+button{border-left:1px solid var(--border)}
  .langsw button.on{background:var(--accent);color:#fff}
  .langsw button:hover:not(.on){color:var(--accent)}
  .credits{margin-top:44px;padding-top:16px;border-top:1px solid var(--border);
    font-size:11px;color:var(--muted);line-height:1.9}
  .credits a{color:var(--muted)}
  .credits .tmdb{height:11px;vertical-align:-1px}
  .lead{font-size:12px;color:var(--muted);margin:0 0 16px;line-height:1.9}
  .lead a{color:var(--muted)}
  .lead .tmdb{height:11px;vertical-align:-1px}
  .lead .notice-en{font-size:11px;opacity:.85}
  h2{font-size:12px;margin:0 0 12px;font-weight:600;color:var(--muted);letter-spacing:.08em}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
  button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);
    border-radius:6px;padding:6px 12px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover:not(:disabled){opacity:.88;color:#fff}
  button.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
  input,select{font:inherit;color:var(--text);background:var(--panel);
    border:1px solid var(--border);border-radius:6px;padding:6px 8px}
  input:focus,select:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
  label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .mobonly{display:none}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .filters .grow{flex:1;min-width:180px}
  .filters .grow input{width:100%}
  .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .stat .k{font-size:11px;color:var(--muted);letter-spacing:.06em}
  .stat .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
  .stat .v small{font-size:12px;font-weight:400;color:var(--muted)}
  .bars{margin-top:4px}
  .bar{display:grid;grid-template-columns:86px 1fr 30px;gap:8px;align-items:center;font-size:11px;
    color:var(--muted);margin-bottom:3px}
  .bar i{display:block;height:6px;border-radius:3px;background:var(--accent);opacity:.75}
  .bar b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
  .bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;
    box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
  .card:focus-visible,.slot:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .card:hover{border-color:var(--accent);transform:translateY(-4px);
    box-shadow:0 12px 26px rgba(0,0,0,.30)}
  @media (prefers-reduced-motion: reduce){
    .card{transition:none} .card:hover{transform:none}
  }
  .card .thumb{position:relative;aspect-ratio:2/3;background:var(--row)}
  /* 明るい絵柄でもスコアと★が読めるように上部だけ暗く落とす */
  .card .thumb::after{content:"";position:absolute;left:0;right:0;top:0;height:66px;
    background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,0));pointer-events:none}
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block;
    opacity:0;transition:opacity .35s ease}
  .card .thumb img.on{opacity:1}
  @media (prefers-reduced-motion: reduce){ .card .thumb img{transition:none} }
  .card .score{position:absolute;left:7px;top:7px;z-index:1;color:#fff;
    background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.16);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;
    font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .card .score.high{color:#ffd76e}
  .card .fav{position:absolute;right:7px;top:7px;z-index:1;width:26px;height:26px;padding:0;
    display:grid;place-items:center;border:none;border-radius:50%;font-size:13px;line-height:1;
    background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    color:rgba(255,255,255,.7);transition:color .15s ease,transform .15s ease}
  .card .fav:hover{color:#ffcf4d;border:none;transform:scale(1.14)}
  /* タッチ環境にはホバーが無いので、プレビューはこのボタンから開く。
     マウス環境では出さない（従来どおりホバーで開く） */
  .card .pvbtn{display:none;position:absolute;right:7px;bottom:7px;z-index:1;
    width:26px;height:26px;padding:0;place-items:center;border:none;border-radius:50%;
    background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    color:rgba(255,255,255,.85)}
  @media (hover: none), (pointer: coarse){ .card .pvbtn{display:grid} }
  .card .fav.on{color:#ffcf4d}
  .card .body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
  /* 1行の題名でも2行分を確保し、下の要素の位置をカード間で揃える */
  .card .ttl{font-size:13px;font-weight:600;line-height:1.4;min-height:2.8em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;
    background:var(--accent-weak);color:var(--accent);margin-right:4px}
  .tag.air{background:transparent;border:1px solid var(--ok);color:var(--ok)}
  .tag.pre{background:transparent;border:1px solid var(--warn);color:var(--warn)}
  .tag.end{background:transparent;border:1px solid var(--border);color:var(--muted)}
  .svc{display:inline-block;font-size:9.5px;line-height:1.5;padding:0 5px;border-radius:3px;
    border:1px solid var(--border);color:var(--muted);margin:3px 3px 0 0;white-space:nowrap}
  .svc.more{border-style:dashed}
  .card .svcs{margin-top:auto;padding-top:3px}
  .calbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .calbar label{display:flex;gap:5px;align-items:center;cursor:pointer;color:var(--text)}
  .calnav{display:flex;gap:4px;align-items:center}
  .calnav button{padding:4px 10px;font-size:12px}
  .calnav button:disabled{opacity:.4}
  .favbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .favbar button{padding:5px 12px;font-size:12px}
  .favbar .note{flex:1;min-width:220px;line-height:1.5}
  .favbar .ask{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;color:var(--text);
    border-top:1px solid var(--border);margin-top:2px;padding-top:10px}
  .favbar .ask.err{color:var(--warn)}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
  .day{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:8px;box-shadow:var(--shadow);min-width:0}
  .day.today{border-color:var(--accent)}
  .day h4{margin:0 0 6px;font-size:12px;font-weight:600;display:flex;gap:5px;align-items:baseline;
    padding-bottom:6px;border-bottom:1px solid var(--border)}
  .day h4 small{color:var(--muted);font-weight:400}
  .day h4 b{margin-left:auto;color:var(--muted);font-weight:400;font-size:11px}
  .day.today h4{color:var(--accent)}
  .day .none{font-size:11px;color:var(--muted);padding:6px 4px}
  .slot{display:flex;gap:6px;padding:5px 4px;border-radius:6px;cursor:pointer;align-items:flex-start}
  .slot:hover{background:var(--row)}
  .slot img{width:30px;height:42px;object-fit:cover;border-radius:3px;flex:none;background:var(--row)}
  .slot .info{min-width:0;flex:1}
  .slot .t{font-size:11px;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
  .slot .n{font-size:11.5px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .slot .e{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .slot .fv{color:#e0a800;margin-left:3px}
  .calnote{font-size:11px;color:var(--muted);margin:12px 2px 0;grid-column:1/-1}
  @media(max-width:900px){ .cal{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .notice{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;
    background:var(--panel);border:1px solid var(--warn);color:var(--warn);
    border-radius:8px;padding:8px 12px;margin-bottom:12px}
  /* 更新のお知らせは警告ではないので色を分ける */
  .notice.info{border-color:var(--accent);color:var(--accent)}
  .notice button{padding:3px 10px;font-size:12px}
  .msg{padding:24px 8px;text-align:center;color:var(--muted);font-size:13px}
  .msg.err{color:var(--danger)}
  .msg button{margin-top:10px;display:block;margin-left:auto;margin-right:auto}
  #more{display:flex;justify-content:center;padding:18px}
  /* ホバープレビュー */
  .preview{position:fixed;z-index:40;left:0;top:0;background:var(--panel);
    border:1px solid var(--accent);border-radius:12px;overflow:hidden;
    box-shadow:0 16px 44px rgba(0,0,0,.38);pointer-events:none;
    opacity:0;transform:scale(.93);transition:opacity .16s ease,transform .16s ease}
  .preview.show{opacity:1;transform:scale(1)}
  .preview .pv-img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--row)}
  .preview .pv-body{padding:10px 12px 12px}
  .preview .pv-ttl{font-size:13.5px;font-weight:600;line-height:1.4}
  .preview .pv-meta{font-size:11px;color:var(--muted);margin:3px 0 6px}
  .preview .pv-sc{font-size:11px;font-weight:600;color:var(--ok);margin-right:6px;
    font-variant-numeric:tabular-nums}
  .preview .pv-next{font-size:11px;color:var(--accent);margin-top:7px}
  .preview .pv-fv{color:#e0a800}
  /* 画面の高さを超えないようにする。狭い画面でも下がはみ出さない */
  .preview{max-height:calc(100vh - 16px)}
  /* ボタンから開いたときだけ操作できる。ホバー時は下のカードの mouseout を邪魔しない */
  .preview.pinned{pointer-events:auto;overflow:auto}
  @media (prefers-reduced-motion: reduce){ .preview{transition:none} }
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50;
    padding:24px;overflow:auto}
  .modal.open{display:block}
  .sheet{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .sheet .banner{height:150px;background:var(--row) center/cover no-repeat}
  .sheet .inner{padding:16px 20px 22px}
  .sheet h3{margin:0 0 2px;font-size:18px}
  .sheet .nat{font-size:12px;color:var(--muted);margin:0 0 12px}
  .sheet .cols{display:flex;gap:16px;flex-wrap:wrap}
  .sheet .cover{width:150px;height:auto;border-radius:8px;border:1px solid var(--border)}
  .sheet .meta{flex:1;min-width:240px}
  .sheet dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:12px}
  .sheet dt{color:var(--muted);white-space:nowrap}
  .sheet dd{margin:0}
  .sheet .desc{font-size:12.5px;white-space:pre-wrap;max-height:230px;overflow:auto;
    border-top:1px solid var(--border);padding-top:10px;margin-top:14px}
  .sheet .src{white-space:normal;font-size:11px;color:var(--muted);margin:12px 0 0;
    display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sheet .src a{color:var(--muted)}
  .sheet .src button{padding:2px 8px;font-size:11px}
  .sheet .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .sheet .links a{font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--border);
    padding:4px 10px;border-radius:6px}
  .sheet .links a:hover{border-color:var(--accent)}
  .sheet .close{float:right}
  @media(max-width:600px){
    body{padding:14px 12px 70px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
    .cal{grid-template-columns:1fr}
    .mobonly{display:block;width:100%}
    .filters.collapsed{display:none}
    .modal{padding:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1 class="brand"><a href="./" id="home" data-i18n-title="home" title="最初の画面に戻る">
      <svg class="mark" viewBox="0 0 32 28" aria-hidden="true">
        <rect x="1.5" y="6" width="11" height="16" rx="2.4" transform="rotate(-17 7 14)"/>
        <rect x="8.5" y="5.5" width="11.5" height="17" rx="2.5" transform="rotate(-8 14.25 14)"/>
        <rect x="17" y="4.5" width="12.5" height="19" rx="2.7" class="lit"/>
      </svg><span class="wm">Cour<span>deck</span></span>
    </a></h1>
    <div class="langsw" id="langsw">
      <button data-lang="ja">日本語</button>
      <button data-lang="en">English</button>
    </div>
  </div>
  <p class="lead" id="lead"></p>

  <div class="panel" id="searchPanel">
    <div class="presets">
      <button data-preset="current" data-i18n="p.current">今季</button>
      <button data-preset="prev" data-i18n="p.prev">前季</button>
      <button data-preset="next" data-i18n="p.next">来季</button>
      <button data-preset="airing" data-i18n="p.airing">放送中の話題作</button>
      <button data-preset="alltime" data-i18n="p.alltime">歴代トップ</button>
      <button data-preset="year" data-i18n="p.year">今年のベスト</button>
    </div>
    <button id="toggleFilters" class="mobonly">詳細な絞り込み ▾</button>
    <div class="filters collapsed" id="filters">
      <label class="f"><span data-i18n="f.year">年</span><select id="year"></select></label>
      <label class="f"><span data-i18n="f.season">季節</span><select id="season">
        <option value="" data-i18n="s.all">通年</option>
        <option value="WINTER" data-i18n="s.winter">冬 (1-3月)</option>
        <option value="SPRING" data-i18n="s.spring">春 (4-6月)</option>
        <option value="SUMMER" data-i18n="s.summer">夏 (7-9月)</option>
        <option value="FALL" data-i18n="s.fall">秋 (10-12月)</option>
      </select></label>
      <label class="f"><span data-i18n="f.sort">並び順</span><select id="sort">
        <option value="POPULARITY_DESC" data-i18n="o.pop">人気順</option>
        <option value="SCORE_DESC" data-i18n="o.score">スコア順</option>
        <option value="TRENDING_DESC" data-i18n="o.trend">話題順</option>
        <option value="START_DATE_DESC" data-i18n="o.new">放送開始が新しい順</option>
        <option value="FAVOURITES_DESC" data-i18n="o.fav">お気に入り数順</option>
        <option value="TITLE_ROMAJI" data-i18n="o.title">タイトル順</option>
      </select></label>
      <label class="f"><span data-i18n="f.format">形式</span><select id="format">
        <option value="" data-i18n="any">すべて</option>
        <option value="TV">TV</option>
        <option value="TV_SHORT" data-i18n="fmt.TV_SHORT">TV(短編)</option>
        <option value="MOVIE" data-i18n="fmt.MOVIE">劇場版</option>
        <option value="OVA">OVA</option>
        <option value="ONA">ONA</option>
        <option value="SPECIAL" data-i18n="fmt.SPECIAL">スペシャル</option>
      </select></label>
      <label class="f"><span data-i18n="f.genre">ジャンル</span><select id="genre"></select></label>
      <label class="f"><span data-i18n="f.score">最低スコア</span><select id="minScore">
        <option value="" data-i18n="none">指定なし</option>
        <option value="60" data-i18n="sc.60">60以上</option>
        <option value="70" data-i18n="sc.70">70以上</option>
        <option value="75" data-i18n="sc.75">75以上</option>
        <option value="80" data-i18n="sc.80">80以上</option>
        <option value="85" data-i18n="sc.85">85以上</option>
      </select></label>
      <label class="f grow"><span data-i18n="f.keyword">キーワード</span><input id="q" type="search" data-i18n-ph="ph.q" data-i18n-title="searchTip" placeholder="作品名で検索（全期間から）"></label>
      <button id="apply" class="primary" data-i18n="btn.apply">この条件で取得</button>
    </div>
  </div>

  <div class="notice info" id="swNotice" hidden></div>
  <div class="notice" id="notice" hidden></div>

  <div class="tabs">
    <button id="tabList" class="on" data-i18n="tab.list">一覧</button>
    <button id="tabCal" data-i18n="tab.cal">曜日表</button>
    <button id="tabFav"><span data-i18n="tab.fav">お気に入り</span> <span id="favCount"></span></button>
    <span style="flex:1"></span>

var lang = "ja";
function t(k, vars){
  var s = (I18N[lang] && I18N[lang][k] != null) ? I18N[lang][k] : (I18N.ja[k] != null ? I18N.ja[k] : k);
  if (vars) for (var p in vars) s = s.split("{" + p + "}").join(vars[p]);
  return s;
}
function detectLang(){
  var u = new URLSearchParams(location.search).get("lang");
  if (u === "ja" || u === "en") return u;
  var saved = null;
  try { saved = localStorage.getItem(LANG_KEY); } catch(e){}
  if (saved === "ja" || saved === "en") return saved;
  return /^ja/i.test(navigator.language || "") ? "ja" : "en";
}
function applyLang(){
  document.documentElement.lang = lang;
  document.title = t("docTitle");
  el("lead").textContent = t("lead");
  el("credits").innerHTML = t("credits");
  Array.prototype.forEach.call(el("langsw").children, function(b){
    b.classList.toggle("on", b.dataset.lang === lang);
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function(n){
    n.textContent = t(n.dataset.i18n);
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-ph]"), function(n){
    n.placeholder = t(n.dataset.i18nPh);
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-title]"), function(n){
    n.title = t(n.dataset.i18nTitle);
  });
  el("toggleFilters").textContent =
    t("btn.filters") + (el("filters").classList.contains("collapsed") ? " ▾" : " ▴");
  fillGenreSelect();
  el("sumTitle").textContent = scopeLabel() + t("sum.suffix");
  favMsg("");                    /* 組み立て済みの文言が残らないよう、切り替え時に消す */
}

/* 表示名は言語に応じて切り替える（英語側は AniList の原語表記をそのまま使う） */
function genreName(g){ return lang === "ja" ? (GENRES[g] || g) : g; }
function formatName(f){ return lang === "ja" ? (FORMATS[f] || f) : (FORMATS_EN[f] || f); }
function statusName(s){ return lang === "ja" ? (STATUS[s] || "") : (STATUS_EN[s] || ""); }
function seasonName(s){ return lang === "ja" ? (SEASONS[s] || "") : (SEASONS_EN[s] || ""); }
function sourceName(s){
  if (!s) return "";
  return lang === "ja" ? (SOURCES[s] || s)
                       : s.charAt(0) + s.slice(1).toLowerCase().replace(/_/g, " ");
}
/* 配信サービス名は固有名詞。英語表示では日本語表記だけ読みやすく置き換える */
var SVC_EN = {
  "dアニメ(Amazon)": "dAnime (Amazon)",
  "アニメタイムズ(Amazon)": "Anime Times (Amazon)",
  "東映アニメ(Amazon)": "Toei Animation (Amazon)",
  "NHKオンデマンド(Amazon)": "NHK On Demand (Amazon)"
};
function svcName(n){ return lang === "ja" ? n : (SVC_EN[n] || n.replace(/\(Amazon\)$/, " (Amazon)")); }

/* ---------- 日本国内の配信情報（GitHub Actions が日次で生成） ---------- */
var stream = null;
function loadStreaming(){
  fetch("data/streaming.json", {cache: "no-cache"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (!j || !j.titles) return;
      stream = j;
      if (state.items.length || state.view === "fav") renderGrid();
      if (cal.rows.length) renderCalendar();

/* ── 日付ロジック ───────────────────────────────────────────────
   放送日の5時始まり、24時間超え表記、シーズン判定はこのアプリの中核だが、
   境界条件を間違えても画面上はそれらしく表示されるため気づきにくい。
   テストできるよう、DOMもグローバル状態も参照しない範囲としてここにまとめる。
   現在時刻に依存する関数は基準時刻を引数で受け取る（内部で new Date() を呼ばない）。
   区切りコメントはテストがこの範囲を切り出す目印なので消さないこと。 */
/* date-logic:start */
function seasonOf(d){
  return ["WINTER","WINTER","WINTER","SPRING","SPRING","SPRING",
          "SUMMER","SUMMER","SUMMER","FALL","FALL","FALL"][d.getMonth()];
}
function shiftSeason(year, season, dir){
  var o = ["WINTER","SPRING","SUMMER","FALL"];
  var i = o.indexOf(season) + dir;
  if (i < 0) { i = 3; year--; }
  if (i > 3) { i = 0; year++; }
  return {year: year, season: o[i]};
}
/* 基準時刻が属する放送シーズン */
function currentSeason(now){
  return {year: now.getFullYear(), season: seasonOf(now)};
}
/* 放送日は「朝5時始まり」で数える（深夜アニメの慣習に合わせる）。
   基準時刻が属する放送日の5:00を返す。引数は書き換えない */
function broadcastToday(now){
  var s = new Date(now.getTime());
  if (s.getHours() < 5) s.setDate(s.getDate() - 1);
  s.setHours(5, 0, 0, 0);
  return s;
}
/* offset 週分ずらした曜日表の表示開始日 */
function calWeekStart(now, offset){
  var s = broadcastToday(now);
  s.setDate(s.getDate() + offset * 7);
  return s;
}
function dayKey(d){ return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }
/* 深夜分は前日扱い。放送日そのものを返す */
function broadcastDate(at){
  var d = new Date(at * 1000);
  if (d.getHours() < 5) d.setDate(d.getDate() - 1);
  return d;
}
/* 深夜は24時制で表記する（25:30 = 翌1:30） */
function airTime(at){
  var d = new Date(at * 1000);
  var h = d.getHours();
  if (h < 5) h += 24;
  return h + ":" + ("0" + d.getMinutes()).slice(-2);
}
/* date-logic:end */

function load(k, def){ try { return JSON.parse(localStorage.getItem(k)) || def; } catch(e){ return def; } }
/* 保存できたかを返す。容量不足で書けなかった場合に呼び出し側が気づけるようにする */
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }

function cacheRaw(key){ return load(CACHE_KEY, {})[key] || null; }
function cacheGet(key){
  var e = cacheRaw(key);
  if (!e || Date.now() - e.t > CACHE_TTL) return null;
  return e.d;
}
function cacheSet(key, data){
  var c = load(CACHE_KEY, {});
  c[key] = {t: Date.now(), d: data};
  var ks = Object.keys(c).sort(function(a,b){ return c[a].t - c[b].t; });
  while (ks.length > CACHE_MAX) delete c[ks.shift()];
  /* 容量超過したら古い順に捨てながら書き込みを試みる */
  while (true){
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(c)); return; }
    catch(e){
      if (ks.length <= 1) return;
      delete c[ks.shift()];
    }
  }
}

function buildVars(page){

  if (state.format) v.format = state.format;
  if (state.genre) v.genre = state.genre;
  if (state.minScore) v.scoreGreater = Number(state.minScore) - 1;
  if (state.status) v.status = state.status;

}

/* クエリ文字列から短い指紋を作る。取得フィールドを変えたら
   キーが変わり、古い形のキャッシュを掴まないようにするため */
function fingerprint(str){
  var h = 5381;
  for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}
var QFP = {};
function gql(query, vars, tag){
  if (!QFP[tag]) QFP[tag] = fingerprint(query);
  var key = tag + QFP[tag] + JSON.stringify(vars);
  if (!state.fresh){
    var hit = cacheGet(key);
    if (hit) return Promise.resolve(hit);
  }
  return fetch(API, {
    method: "POST",
    headers: {"Content-Type": "application/json", "Accept": "application/json"},
    body: JSON.stringify({query: query, variables: vars})
  }).then(function(res){
    if (res.status === 429){
      var wait = res.headers.get("Retry-After") || "60";
      throw new Error(t("errRate", {s: wait}));
    }
    if (!res.ok) throw new Error(t("errHttp", {s: res.status}));
    return res.json();
  }).then(function(json){
    if (json.errors) throw new Error(json.errors.map(function(e){ return e.message; }).join(" / "));
    var data = json.data.Page;
    cacheSet(key, data);
    return data;
  }).catch(function(err){
    /* 通信できないときは期限切れのキャッシュで代替する */
    var stale = cacheRaw(key);
    if (stale){
      staleNotice(stale.t);
      return stale.d;
    }
    throw new Error(friendlyError(err));
  });
}

function friendlyError(err){
  if (!navigator.onLine) return t("errOffline");
  if (err instanceof TypeError) return t("errConn");
  return err.message;
}
function staleNotice(at){
  var when = new Date(at).toLocaleString(lang === "ja" ? "ja-JP" : "en-US",
    {month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"});
  showNotice(t(navigator.onLine ? "staleOn" : "staleOff", {t: when}));
}
function showNotice(text){

  n.hidden = false;

}
function hideNotice(){ el("notice").hidden = true; }

function fetchPage(page){ return gql(QUERY, buildVars(page), "m"); }

function loadMore(auto){
  if (state.loading || !state.hasNext) return;
  if (auto) state.autoPages++;
  state.loading = true;
  renderMore();
  fetchPage(state.page).then(function(data){
    state.items = state.items.concat(data.media);
    state.hasNext = data.pageInfo.hasNextPage && data.media.length > 0;
    state.total = data.pageInfo.total;
    state.page++;
    state.fresh = false;
    msg("");
    renderGrid();
    renderSummary();
  }).catch(function(err){
    msg(err.message, true, true);
  }).then(function(){
    state.loading = false;
    state.fresh = false;
    renderMore();
    checkAutoLoad();       /* 画面がまだ埋まっていなければ続けて読み込む */
  });
}

var AUTO_PAGE_LIMIT = 10;                              /* 連続で自動読み込みする上限ページ数 */
var autoLoadOn = ("IntersectionObserver" in window);   /* 非対応環境はボタン表示にする */

function canAutoLoad(){
  return autoLoadOn && state.view === "list" && state.hasNext &&
         !state.loading && state.autoPages < AUTO_PAGE_LIMIT;

function renderMore(){

function topCount(list, pick){

/* ---------- 曜日表（今週の放送予定） ---------- */
var WEEK_JA = ["日","月","火","水","木","金","土"];
function weekName(i){ return lang === "ja" ? WEEK_JA[i] : WEEK_EN[i]; }
var SHORT_FORMATS = ["TV_SHORT", "MUSIC", "SPECIAL", "OVA"];
var cal = {rows: [], byId: {}, loading: false, loaded: false, err: "", offset: 0, pending: false};

/* cal.offset 週分ずらした表示開始日。計算そのものは上の日付ロジックにある */
function calStart(){ return calWeekStart(new Date(), cal.offset); }

function setCalNav(on){
  el("calPrev").disabled = !on;
  el("calNext").disabled = !on;
  el("calThis").disabled = !on || cal.offset === 0;
}
function loadCalendar(force){
  /* 読み込み中の要求は捨てずに覚えておく。連打で表示と内容がずれるのを防ぐ */
  if (cal.loading){ cal.pending = true; return; }
  if (cal.loaded && !force){ renderCalendar(); return; }
  var reqOffset = cal.offset;
  cal.loading = true; cal.rows = []; cal.byId = {}; cal.err = "";
  setCalNav(false);
  hideNotice();
  renderCalendar();
  var start = calStart();
  var from = Math.floor(start.getTime() / 1000);
  var to = from + 7 * 86400;
  var page = 1;
  function step(){
    return gql(SCHEDULE_QUERY, {page: page, perPage: 50, from: from - 1, to: to}, "s").then(function(data){
      (data.airingSchedules || []).forEach(function(s){
        if (!s.media || s.media.isAdult) return;
        cal.rows.push({at: s.airingAt, ep: s.episode, m: s.media});
        cal.byId[s.media.id] = s.media;
      });
      renderCalendar();            /* 取得できたページから順に描画 */
      page++;
      if (data.pageInfo.hasNextPage && page <= 8) return step();
    });
  }
  step().then(function(){
    cal.loaded = true;
  }).catch(function(e){
    cal.err = e.message;
  }).then(function(){
    cal.loading = false;
    state.fresh = false;
    setCalNav(true);
    /* 読み込み中に週が変わっていたら取り直す */
    if (cal.pending || cal.offset !== reqOffset){
      cal.pending = false;
      loadCalendar(true);
      return;
    }
    renderCalendar();
  });
}

function calFilter(r){
  var m = r.m;
  if (el("calFav").checked && !favs[m.id]) return false;
  if (el("calSeason").checked){
    /* 読み込み時の季節ではなく、その放送日が属する季節で判定する。
       週を送った先や、季節をまたぐ週でも正しく絞り込むため */
    var d = broadcastDate(r.at);
    if (!(m.seasonYear === d.getFullYear() && m.season === seasonOf(d))) return false;
  }
  if (el("calNoShort").checked && SHORT_FORMATS.indexOf(m.format) >= 0) return false;
  return true;
}
function renderCalendar(){
  hidePreview();
  var box = el("cal");
  if (cal.loading && !cal.rows.length){
    box.innerHTML = '<div class="msg" style="grid-column:1/-1">' + t("calLoading") + "</div>";
    return;
  }
  if (cal.err){
    box.innerHTML = '<div class="msg err" style="grid-column:1/-1">' + esc(cal.err) +
      '<button id="calRetry">' + t("retry") + "</button></div>";
    el("calRetry").onclick = refresh;
    return;
  }

  var start = calStart();
  var days = [], index = {};
  for (var i = 0; i < 7; i++){
    var d = new Date(start.getTime());
    d.setDate(d.getDate() + i);
    days.push({d: d, rows: []});
    index[dayKey(d)] = i;
  }
  var shown = 0;
  cal.rows.forEach(function(r){
    if (!calFilter(r)) return;
    var i = index[dayKey(broadcastDate(r.at))];
    if (i == null) return;
    days[i].rows.push(r);
    shown++;
  });

  var todayKey = dayKey(broadcastToday(new Date()));   /* 週を送っても今日の位置は動かさない */
  box.innerHTML = days.map(function(o){
    var slots = o.rows.map(function(r){
      var m = r.m;
      var img = m.coverImage && m.coverImage.medium
        ? '<img loading="lazy" src="' + esc(m.coverImage.medium) + '" alt="">' : "";
      var sc = m.averageScore ? (lang === "ja" ? " ・ " : " · ") + (m.averageScore / 10).toFixed(1) : "";
      var star = favs[m.id] ? '<span class="fv">★</span>' : "";
      return '<div class="slot" data-id="' + m.id + '" tabindex="0" role="button"' +
        ' aria-label="' + esc(t("openDetail", {n: title(m)})) + '">' + img +
        '<div class="info"><div class="t">' + airTime(r.at) + star + "</div>" +
        '<div class="n">' + esc(title(m)) + "</div>" +
        '<div class="e">' + t("epNo", {n: r.ep}) + sc + "</div></div></div>";
    }).join("");
    return '<section class="day' + (dayKey(o.d) === todayKey ? " today" : "") + '">' +
      "<h4>" + weekName(o.d.getDay()) + "<small>" + (o.d.getMonth() + 1) + "/" + o.d.getDate() + "</small>" +
      "<b>" + o.rows.length + "</b></h4>" +
      (slots || '<div class="none">' + t("noAir") + "</div>") + "</section>";
  }).join("") +
  '<p class="calnote">' + rangeLabel(start) + (cal.loading ? t("calLoadingSuffix") : "") +
  t("calShown", {n: shown, m: cal.rows.length}) +
  (shown === 0 && el("calFav").checked && !cal.loading ? t("calFavNone") : "") +
  t("calNote") + "</p>";
}
function rangeLabel(start){

                        b: (end.getMonth() + 1) + "/" + end.getDate()});
}

/* ---------- 日本語のあらすじ（日本語版Wikipediaの導入部） ---------- */
var WIKI_API = "https://ja.wikipedia.org/w/api.php";
var wikiCache = {};                    /* 作品ID -> {text,title,url} または false */

/* 括弧書き・季数表記を落として作品名の芯を取り出す */
function baseTitle(s){
  return String(s || "")
    .replace(/[（(][^）)]*[）)]/g, "")
    .replace(/第[0-9０-９]+期|シーズン\s*[0-9０-９]+|season\s*[0-9]+|[0-9]+(st|nd|rd|th)\s*season/gi, "")
    .replace(/[ⅠⅡⅢⅣⅤⅥ]/g, "")
    .trim();
}
/* 照合用の正規化。記号は種類が多いので「残す文字」を指定する */
function normTitle(s){
  return baseTitle(s)
    .replace(/[^0-9A-Za-zぁ-ゖァ-ヺー一-鿿]/g, "")
    .toLowerCase();
}
function wikiUrl(params){
  var q = "action=query&format=json&origin=*&prop=extracts&exintro=1&explaintext=1&redirects=1";
  return WIKI_API + "?" + q + "&" + params;
}
function pickPage(json, want){
  var pages = json && json.query && json.query.pages;
  if (!pages) return null;
  /* 検索結果は index が検索順位を持つのでその順に見る */
  var list = Object.keys(pages).map(function(k){ return pages[k]; })
    .sort(function(a, b){ return (a.index || 0) - (b.index || 0); });
  for (var i = 0; i < list.length; i++){
    var p = list[i];
    if (!p || p.missing !== undefined || !p.extract) continue;
    var text = p.extract.trim();
    if (text.length < 30 || text.indexOf("曖昧さ回避") >= 0) continue;
    /* 別作品の記事を拾わないよう、タイトルの包含関係を確認する */
    if (want){
      var a = normTitle(p.title), b = normTitle(want);
      if (a.indexOf(b) < 0 && b.indexOf(a) < 0) continue;
    }
    return {text: text, title: p.title,
            url: "https://ja.wikipedia.org/wiki/" + encodeURIComponent(p.title)};
  }
  return null;
}
function loadWiki(m){
  if (wikiCache[m.id] !== undefined) return Promise.resolve(wikiCache[m.id]);
  var nat = m.title.native;
  if (!nat) return Promise.resolve(false);
  var base = baseTitle(nat);
  function byTitle(name){
    return fetch(wikiUrl("titles=" + encodeURIComponent(name)))
      .then(function(r){ return r.json(); })
      .then(function(j){ return pickPage(j, nat); });
  }
  return byTitle(nat)
    .then(function(hit){ return hit || (base !== nat ? byTitle(base) : null); })
    .then(function(hit){
      if (hit) return hit;
      /* 見つからなければ検索で最有力の3件から照合する */
      return fetch(wikiUrl("generator=search&gsrnamespace=0&gsrlimit=3&gsrsearch=" +
                           encodeURIComponent(base)))
        .then(function(r){ return r.json(); })
        .then(function(j2){ return pickPage(j2, base); });
    })
    .then(function(hit){ wikiCache[m.id] = hit || false; return wikiCache[m.id]; })
    .catch(function(){ return false; });
}

/* 直前の操作がキーボードだったか。マウスでカードを押してもフォーカスは当たるので、

function showPreview(anchor, m, pinned){
  if (!pvEl){
    pvEl = document.createElement("div");
    pvEl.className = "preview";
    document.body.appendChild(pvEl);
  }
  pvEl.innerHTML = previewHtml(m);
  pvEl.classList.toggle("pinned", !!pinned);  /* 高さを測る前に確定させる */
  var r = anchor.getBoundingClientRect();
  /* 狭い画面では画面幅に収める。左右に8pxずつ余白を残す */
  var maxW = Math.min(380, window.innerWidth - 16);
  var w = Math.min(Math.max(r.width * 1.5, 300), maxW);
  pvEl.style.width = w + "px";
  var h = pvEl.offsetHeight;                 /* 表示前に高さを確定させる */
  var left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, window.innerWidth - w - 8));
  var top = Math.max(8, Math.min(r.top + r.height / 2 - h / 2, window.innerHeight - h - 8));
  pvEl.style.left = left + "px";
  pvEl.style.top = top + "px";
  pvEl.classList.add("show");
}
function hidePreview(){
  clearTimeout(pvTimer);
  pvTarget = null;
  /* pinned を残すと、消えたあとも透明なまま操作を横取りしてしまう */
  if (pvEl) pvEl.classList.remove("show", "pinned");

/* ホバーの遅延を挟まずに開く。キーボードとタッチはどちらも意図的な操作なので待たせない */
function openPreviewFor(node, pinned){
  if (!node) return;
  var m = findMedia(Number(node.dataset.id));
  if (!m) return;
  clearTimeout(pvTimer);
  pvTarget = node;
  showPreview(node, m, pinned);
}
function bindPreview(rootId, selector){
  var root = el(rootId);
  /* キーボードで辿ったときは、ホバーと同じパネルをフォーカスで開く */
  root.addEventListener("focusin", function(e){
    var node = e.target.closest(selector);
    if (!node || !keyNav) return;
    openPreviewFor(node, false);
  });
  root.addEventListener("focusout", function(e){
    var node = e.target.closest(selector);
    if (!node) return;
    if (e.relatedTarget && node.contains(e.relatedTarget)) return;
    hidePreview();
  });
  root.addEventListener("mouseover", function(e){
    if (!hoverOn) return;
    var node = e.target.closest(selector);
    if (!node || node === pvTarget) return;
    pvTarget = node;
    clearTimeout(pvTimer);
    pvTimer = setTimeout(function(){
      if (pvTarget !== node || !document.body.contains(node)) return;
      var m = findMedia(Number(node.dataset.id));
      if (m) showPreview(node, m);
    }, HOVER_DELAY);
  });
  root.addEventListener("mouseout", function(e){
    var node = e.target.closest(selector);
    if (!node) return;
    if (e.relatedTarget && node.contains(e.relatedTarget)) return;   /* 同じ要素の中の移動は無視 */
    hidePreview();
  });
}

function trapFocus(e){

  var f = el("sheet").querySelectorAll("a[href], button, [tabindex]:not([tabindex='-1'])");
  if (!f.length) return;
  var first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}

/* ── お気に入りの書き出し / 読み込み ───────────────────────────
   FileReader とローカルへのダウンロードだけで完結させる。外部への送信は一切しない。
   読み込んだファイルは AniList から来たデータと同じく信用しない。既知の項目だけを
   型を見ながら移し替え、URL は http(s) に限る。未知の項目は捨てる。 */
var FAV_FORMAT = 1;                       /* 形式のバージョン。互換性が切れたら上げる */
var FAV_MAX_MB = 5;
var FAV_MAX_ITEMS = 5000;

function favStr(v, max){ return typeof v === "string" ? v.slice(0, max || 200) : ""; }
function favNum(v){ return typeof v === "number" && isFinite(v) ? v : null; }
function favUrl(v){ var s = favStr(v, 500); return /^https?:\/\//i.test(s) ? s : ""; }
function favYmd(v){
  return v && typeof v === "object"
    ? {year: favNum(v.year), month: favNum(v.month), day: favNum(v.day)} : null;
}

/* アプリが描画に使う項目だけを取り出した作品データを作る。
   id が無いもの、タイトルが1つも無いものは中身が無いので捨てる */
function favClean(raw){
  if (!raw || typeof raw !== "object") return null;
  var id = favNum(raw.id);
  if (!id || id <= 0) return null;
  var ti = raw.title && typeof raw.title === "object" ? raw.title : {};
  if (!favStr(ti.romaji) && !favStr(ti.english) && !favStr(ti.native)) return null;
  var ci = raw.coverImage && typeof raw.coverImage === "object" ? raw.coverImage : {};
  var color = favStr(ci.color, 10);
  var nodes = raw.studios && raw.studios.nodes;
  var next = raw.nextAiringEpisode && typeof raw.nextAiringEpisode === "object" ? raw.nextAiringEpisode : null;
  var tr = raw.trailer && typeof raw.trailer === "object" ? raw.trailer : null;
  return {
    id: id,
    title: {romaji: favStr(ti.romaji), english: favStr(ti.english), native: favStr(ti.native)},
    description: favStr(raw.description, 4000),
    format: favStr(raw.format, 40), status: favStr(raw.status, 40), source: favStr(raw.source, 40),
    episodes: favNum(raw.episodes), duration: favNum(raw.duration),
    season: favStr(raw.season, 20), seasonYear: favNum(raw.seasonYear),
    averageScore: favNum(raw.averageScore), popularity: favNum(raw.popularity),
    favourites: favNum(raw.favourites),
    genres: Array.isArray(raw.genres)
      ? raw.genres.slice(0, 20).map(function(g){ return favStr(g, 40); }).filter(Boolean) : [],
    coverImage: {
      large: favUrl(ci.large), medium: favUrl(ci.medium),
      color: /^#[0-9a-f]{3,8}$/i.test(color) ? color : null
    },
    bannerImage: favUrl(raw.bannerImage),
    startDate: favYmd(raw.startDate), endDate: favYmd(raw.endDate),
    studios: {nodes: Array.isArray(nodes)
      ? nodes.slice(0, 5).map(function(s){ return {name: favStr(s && s.name, 80)}; })
             .filter(function(s){ return s.name; }) : []},
    nextAiringEpisode: next ? {episode: favNum(next.episode), airingAt: favNum(next.airingAt)} : null,
    trailer: tr ? {id: favStr(tr.id, 60), site: favStr(tr.site, 20)} : null,
    externalLinks: Array.isArray(raw.externalLinks)
      ? raw.externalLinks.slice(0, 12)
          .map(function(l){ return {site: favStr(l && l.site, 60), url: favUrl(l && l.url)}; })
          .filter(function(l){ return l.site && l.url; }) : [],
    siteUrl: favUrl(raw.siteUrl)
  };
}

function favMsg(text, isErr){
  var box = el("favAsk");
  box.className = "ask" + (isErr ? " err" : "");
  box.innerHTML = text ? "<span>" + esc(text) + "</span>" : "";
  box.hidden = !text;
}

function stamp(){
  var d = new Date();
  var p = function(n){ return ("0" + n).slice(-2); };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
/* 端末内へ保存するだけ。外部への送信はしない */
function downloadFile(text, name, type){
  var url = URL.createObjectURL(new Blob([text], {type: type}));
  var a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 0);
}

function exportFavs(){
  var list = Object.keys(favs).map(function(k){ return favClean(favs[k]); }).filter(Boolean);
  if (!list.length){ favMsg(t("favNone"), true); return; }

    app: "courdeck", version: FAV_FORMAT,
    exportedAt: new Date().toISOString(), count: list.length, favorites: list
  }, null, 2);
  downloadFile(body, "courdeck-favorites-" + stamp() + ".json", "application/json");
  favMsg(t("favSaved", {n: list.length}));
}

/* ── お気に入りの次回放送を iCalendar として書き出す ─────────────
   購読用のURL配信はサーバーが要るので作らない。ファイルのダウンロードに留める。
   保持しているのは nextAiringEpisode の1話分だけなので、1作品につき1件になる。 */
var ICS_DEFAULT_MIN = 30;

function icsEsc(s){
  return String(s == null ? "" : s)
    .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,")
    .replace(/\r?\n/g, "\\n");
}
/* RFC 5545 は1行75オクテットまで。日本語が途中で割れないようバイト数で数えて折る。
   継続行は先頭に空白を1つ置く決まりで、その空白も1オクテットとして数える */
function icsFold(line){
  var out = "", len = 0, i = 0;
  while (i < line.length){
    var cp = line.codePointAt(i);
    var ch = String.fromCodePoint(cp);
    var b = cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4;
    if (len + b > 73){ out += "\r\n "; len = 1; }
    out += ch;
    len += b;
    i += ch.length;
  }
  return out;
}
/* 放送時刻は絶対時刻なのでUTCで書く。カレンダー側が閲覧者の地域で表示するため、
   日本時間で見れば 25:30 の放送は翌日の 1:30 として出る */
function icsUtc(d){
  var p = function(n){ return ("0" + n).slice(-2); };
  return d.getUTCFullYear() + p(d.getUTCMonth() + 1) + p(d.getUTCDate()) + "T" +
         p(d.getUTCHours()) + p(d.getUTCMinutes()) + p(d.getUTCSeconds()) + "Z";
}

function exportIcs(){
  var now = new Date(), rows = [], skipped = 0;
  Object.keys(favs).forEach(function(k){
    var m = favs[k];
    var ep = m && m.nextAiringEpisode;
    /* 放送予定が分からない作品（完結済みなど）は書き出せない */
    if (!ep || !ep.airingAt || !ep.episode) { skipped++; return; }
    rows.push({m: m, ep: ep});
  });
  if (!rows.length){ favMsg(t("icsNone"), true); return; }

  var lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Naatlant//Courdeck//EN",
               "CALSCALE:GREGORIAN", "X-WR-CALNAME:" + icsEsc(t("icsCalName"))];
  rows.forEach(function(r){
    var start = new Date(r.ep.airingAt * 1000);
    var end = new Date(start.getTime() + (r.m.duration || ICS_DEFAULT_MIN) * 60000);
    var svc = svcOf(r.m.id);
    var desc = (svc ? svc.map(svcName).join(", ") : "") +
      (r.m.siteUrl ? (svc ? "\n\n" : "") + r.m.siteUrl : "");
    lines.push("BEGIN:VEVENT",
      /* 作品IDと話数から決まるので、同じファイルを二度読んでも重複しない */
      "UID:courdeck-" + r.m.id + "-ep" + r.ep.episode + "@naatlant.github.io",
      "DTSTAMP:" + icsUtc(now),
      "DTSTART:" + icsUtc(start),
      "DTEND:" + icsUtc(end),
      "SUMMARY:" + icsEsc(title(r.m) + " " + t("epNo", {n: r.ep.episode})));
    if (desc) lines.push("DESCRIPTION:" + icsEsc(desc));
    if (r.m.siteUrl) lines.push("URL:" + icsEsc(r.m.siteUrl));
    lines.push("END:VEVENT");
  });
  lines.push("END:VCALENDAR");

  downloadFile(lines.map(icsFold).join("\r\n") + "\r\n",
    "courdeck-schedule-" + stamp() + ".ics", "text/calendar;charset=utf-8");
  favMsg(t("icsSaved", {n: rows.length}) + (skipped ? t("icsSkipped", {n: skipped}) : ""));
}

/* 中身を確かめるだけで、お気に入りには触れない。壊れたファイルで既存データを失わないため */
function parseFavFile(text){
  var data;
  try { data = JSON.parse(text); } catch(e){ return {err: t("favErrJson")}; }
  if (!data || typeof data !== "object" || !Array.isArray(data.favorites)) return {err: t("favErrShape")};
  if (data.version !== FAV_FORMAT) return {err: t("favErrVersion", {s: String(data.version)})};
  var items = [], skipped = 0;
  for (var i = 0; i < data.favorites.length; i++){
    if (items.length >= FAV_MAX_ITEMS) { skipped += data.favorites.length - i; break; }
    var m = favClean(data.favorites[i]);
    if (m) items.push(m); else skipped++;
  }
  if (!items.length) return {err: t("favErrEmpty")};
  return {items: items, skipped: skipped};
}

function applyFavs(items, mode){
  var backup = favs;
  var next = {}, added = 0, dup = 0;
  if (mode !== "replace"){
    Object.keys(favs).forEach(function(k){ next[k] = favs[k]; });
  }
  items.forEach(function(m){
    if (next[m.id]) dup++;
    else { next[m.id] = m; added++; }
  });
  favs = next;
  if (!save(FAV_KEY, favs)){
    favs = backup;                        /* 書けなかったら元に戻す */
    save(FAV_KEY, favs);
    favMsg(t("favErrSave"), true);
    return;
  }
  renderFavCount();
  renderGrid();
  if (cal.rows.length) renderCalendar();
  favMsg(mode === "replace" ? t("favReplaced", {n: added})
       : added ? t("favMerged", {n: added, d: dup})
       : t("favMergedNone", {d: dup}));
}

function askFavApply(res){
  var box = el("favAsk");
  box.className = "ask";
  box.innerHTML = "<span>" +
    esc(t("favRead", {n: res.items.length}) + (res.skipped ? t("favSkipped", {n: res.skipped}) : "")) +
    "</span>" +
    '<button id="favDoReplace">' + esc(t("favReplace")) + "</button>" +
    '<button id="favDoMerge">' + esc(t("favMerge")) + "</button>" +
    '<button id="favDoCancel">' + esc(t("favCancel")) + "</button>";
  box.hidden = false;
  el("favDoReplace").onclick = function(){ applyFavs(res.items, "replace"); };
  el("favDoMerge").onclick = function(){ applyFavs(res.items, "merge"); };
  el("favDoCancel").onclick = function(){ favMsg(""); };
  el("favDoReplace").focus();
}

function readFavFile(file){
  if (!file) return;
  if (file.size > FAV_MAX_MB * 1024 * 1024){
    favMsg(t("favErrBig", {s: String(FAV_MAX_MB)}), true);
    return;
  }
  var r = new FileReader();
  r.onerror = function(){ favMsg(t("favErrRead"), true); };
  r.onload = function(){
    var res = parseFavFile(String(r.result));
    if (res.err) favMsg(res.err, true); else askFavApply(res);
  };
  r.readAsText(file);
}

function syncForm(){
  el("year").value = state.year || "";
  el("season").value = state.season || "";
  el("sort").value = state.sort;
  el("format").value = state.format;
  el("genre").value = state.genre;
  el("minScore").value = state.minScore;
  el("q").value = state.q;
}
function readForm(){
  state.year = el("year").value;
  state.season = el("season").value;
  state.sort = el("sort").value;
  state.format = el("format").value;
  state.genre = el("genre").value;
  state.minScore = el("minScore").value;
  state.q = el("q").value;
}

/* ---------- 条件をURLに保存する（共有・ブックマーク・戻る操作に対応） ---------- */
function validOpt(id, v){
  if (!v) return "";
  var s = el(id);
  for (var i = 0; i < s.options.length; i++) if (s.options[i].value === v) return v;
  return "";
}
function buildQuery(){
  var p = [];
  function add(k, v){ if (v) p.push(k + "=" + encodeURIComponent(v)); }
  add("lang", lang);
  if (state.view !== "list") add("view", state.view);
  var q = state.q.trim();
  add("q", q);
  /* 今季のままなら年・季節は書かない（リンクが常に「今季」を指すように） */
  var isCurrent = String(state.year) === String(CUR.year) && state.season === CUR.season;
  if (!q && !isCurrent){
    p.push("year=" + encodeURIComponent(state.year || ""));
    p.push("season=" + encodeURIComponent(state.season || ""));
  }
  if (state.sort !== "POPULARITY_DESC") add("sort", state.sort);
  add("format", state.format);
  add("genre", state.genre);
  add("score", state.minScore);
  add("status", state.status);
  return p.length ? "?" + p.join("&") : "";
}
function applyQuery(search){
  var u = new URLSearchParams(search || "");
  var l = u.get("lang");
  if (l === "ja" || l === "en") lang = l;
  state.q = u.get("q") || "";
  state.year = u.has("year") ? validOpt("year", u.get("year")) : CUR.year;
  state.season = u.has("season") ? validOpt("season", u.get("season")) : CUR.season;
  state.sort = validOpt("sort", u.get("sort")) || "POPULARITY_DESC";
  state.format = validOpt("format", u.get("format"));
  state.genre = validOpt("genre", u.get("genre"));
  state.minScore = validOpt("minScore", u.get("score"));
  state.status = u.get("status") === "RELEASING" ? "RELEASING" : "";
  var v = u.get("view");
  return (v === "cal" || v === "fav") ? v : "list";
}
function syncUrl(push){
  var url = location.pathname + buildQuery();
  try { history[push ? "pushState" : "replaceState"]({}, "", url); } catch(e){}
}

var PRESETS = {
  current: function(){ return {year: CUR.year, season: CUR.season, sort: "POPULARITY_DESC", status: "", q: "", minScore: ""}; },
  prev: function(){ var s = shiftSeason(CUR.year, CUR.season, -1); return {year: s.year, season: s.season, sort: "POPULARITY_DESC", status: "", q: "", minScore: ""}; },
  next: function(){ var s = shiftSeason(CUR.year, CUR.season, 1); return {year: s.year, season: s.season, sort: "POPULARITY_DESC", status: "", q: "", minScore: ""}; },
  airing: function(){ return {year: "", season: "", sort: "TRENDING_DESC", status: "RELEASING", q: "", minScore: ""}; },
  alltime: function(){ return {year: "", season: "", sort: "SCORE_DESC", status: "", q: "", minScore: "75"}; },
  year: function(){ return {year: CUR.year, season: "", sort: "SCORE_DESC", status: "", q: "", minScore: ""}; }
};

});
el("modal").addEventListener("click", function(e){ if (e.target.id === "modal") closeDetail(); });
document.addEventListener("keydown", function(e){
  if (e.key === "Escape"){
    if (el("modal").classList.contains("open")) closeDetail();
    else if (pvEl && pvEl.classList.contains("show")) hidePreview();
    else if (document.activeElement === el("q")) el("q").blur();
    return;
  }
  /* / で検索欄へ。入力中やモーダル表示中は無効 */
  if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey) return;
  var a = document.activeElement;
  if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;
  if (el("modal").classList.contains("open")) return;
  e.preventDefault();
  el("filters").classList.remove("collapsed");
  el("toggleFilters").textContent = t("btn.filters") + " ▴";
  el("q").focus();
  el("q").select();
});

/* ---------- ホーム画面から起動できるようにする（任意の拡張） ----------
   file:// や Service Worker 非対応の環境では登録しないだけで、本体は従来どおり動く。
   isSecureContext を見るのは、https と localhost の両方を通すため。

   新しい版を勝手に有効化しない。閲覧中の画面が差し替わるのを避けるためで、
   代わりに待機させて「再読み込み」を出す。ここを作らずに Service Worker を入れると、
   利用者が古い版を掴んだまま更新が永久に届かなくなる。 */
function showSwUpdate(reg){
  var n = el("swNotice");
  n.innerHTML = "<span>" + esc(t("swUpdate")) + '</span><button id="swReload">' +
    esc(t("swReload")) + "</button>";
  n.hidden = false;
  el("swReload").onclick = function(){
    if (reg.waiting) reg.waiting.postMessage("skip-waiting");
  };
}
/* file:// でも isSecureContext は true になるが Service Worker は使えない。
   プロトコルを明示的に見て、無駄な登録を試みないようにする */
if ("serviceWorker" in navigator && window.isSecureContext && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      function watch(w){
        if (!w) return;
        w.addEventListener("statechange", function(){
          /* controller があるときだけ「更新」。初回の導入では出さない */
          if (w.state === "installed" && navigator.serviceWorker.controller) showSwUpdate(reg);
        });
      }
      if (reg.waiting && navigator.serviceWorker.controller) showSwUpdate(reg);
      watch(reg.installing);
      reg.addEventListener("updatefound", function(){ watch(reg.installing); });
    }).catch(function(){ /* 登録できなくても本体は動く */ });

    /* 交代が済んだら1度だけ読み直す */
    var swReloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if (swReloading) return;
      swReloading = true;
      location.reload();
    });
  });
}
