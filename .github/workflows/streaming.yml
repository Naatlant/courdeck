name: 配信情報の更新

on:
  schedule:
    - cron: "0 18 * * *"       # 毎日 03:00 JST … 前季〜来季＋歴代トップのみ更新
    - cron: "30 18 * * 0"      # 日曜 03:30 JST … 全作品を再取得
  workflow_dispatch:
    inputs:
      mode:
        description: "all を指定すると全作品を再取得する（既定は今季周辺のみ）"
        required: false
        default: "season"

permissions:
  contents: write

concurrency:
  group: streaming
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # 自前照合で判明した AniList ID → TMDB ID の対応表。
      # TMDB IDを含むためリポジトリには置かず、Actions のキャッシュに載せる。
      # 日次で実行されるので7日無アクセスによる破棄には当たらない。
      # 失われた場合も上限つきで順次引き直されるだけで、壊れはしない。
      - name: 自前照合のキャッシュを復元
        uses: actions/cache@v6
        with:
          path: .cache
          key: tmdb-ids-${{ github.run_id }}
          restore-keys: tmdb-ids-

      - name: 配信情報を取得
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: >
          node scripts/fetch-streaming.mjs
          ${{ (github.event.inputs.mode == 'all' || github.event.schedule == '30 18 * * 0') && '--all' || '' }}

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/streaming.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "配信情報を更新"
            git push
          fi
